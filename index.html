<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kerf works out the cheapest boards and sheets to buy for a cut list, and how to cut them.">
<meta name="theme-color" content="#F2F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<title>Kerf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Big+Shoulders+Stencil:wght@700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F2F4F0;--grid:#E2E6DF;--surface:#FFFFFF;--surface2:#EDF0EB;--sunk:#E6E9E3;
  --ink:#1C1F22;--ink2:#50575E;--ink3:#80878E;--line:#D6DAD3;--line2:#B9BFB7;
  --tape:#F2C200;--tape-ink:#1C1F22;--tape-soft:#FAEAA6;
  --chalk:#2361CC;--chalk-soft:#DCE6F8;
  --pine:#EBD3A6;--pine2:#D9B880;--pine-edge:#B08447;--ply:#E8D7B2;--ply-edge:#9E7F52;
  --scrap:#CDD2CA;--scrap2:#B7BDB4;
  --bad:#B53D27;--bad-soft:#F7DDD6;--good:#2B7349;--good-soft:#D8EDDD;
  --disp:"Big Shoulders Stencil","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  --shadow:0 1px 0 rgba(28,31,34,.04),0 6px 18px -12px rgba(28,31,34,.28);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#121416;--grid:#1B1E21;--surface:#1A1D20;--surface2:#212529;--sunk:#16181B;
  --ink:#E9ECEE;--ink2:#A9B0B6;--ink3:#79818A;--line:#2B3035;--line2:#3D444B;
  --tape:#F2C200;--tape-ink:#15171A;--tape-soft:#3F3510;
  --chalk:#7AA8FF;--chalk-soft:#1B2944;
  --pine:#C9AB78;--pine2:#B18F5A;--pine-edge:#7E5F31;--ply:#C3AA7E;--ply-edge:#7C6039;
  --scrap:#30353A;--scrap2:#424950;
  --bad:#F0826B;--bad-soft:#40211B;--good:#70C390;--good-soft:#193022;
  --shadow:0 1px 0 rgba(0,0,0,.35),0 10px 24px -14px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121416;--grid:#1B1E21;--surface:#1A1D20;--surface2:#212529;--sunk:#16181B;
  --ink:#E9ECEE;--ink2:#A9B0B6;--ink3:#79818A;--line:#2B3035;--line2:#3D444B;
  --tape:#F2C200;--tape-ink:#15171A;--tape-soft:#3F3510;
  --chalk:#7AA8FF;--chalk-soft:#1B2944;
  --pine:#C9AB78;--pine2:#B18F5A;--pine-edge:#7E5F31;--ply:#C3AA7E;--ply-edge:#7C6039;
  --scrap:#30353A;--scrap2:#424950;
  --bad:#F0826B;--bad-soft:#40211B;--good:#70C390;--good-soft:#193022;
  --shadow:0 1px 0 rgba(0,0,0,.35),0 10px 24px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--ground);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
input,select{background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;min-width:0;font-size:16px}
input:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
input.bad{border-color:var(--bad);background:var(--bad-soft)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.fr{font-size:.72em;letter-spacing:0;white-space:nowrap}
.fr sup,.fr sub{font-size:1em;line-height:0}
.fr sup{vertical-align:.5em}.fr sub{vertical-align:-.05em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.top-in{display:flex;align-items:center;gap:10px;max-width:1320px;margin:0 auto}
.brand{flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--tape);color:var(--tape-ink);font:800 26px/1 var(--disp);letter-spacing:.06em;padding:5px 10px 4px 12px;border-radius:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.pname{flex:1;min-width:0;font:600 18px var(--body);background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 8px}
.pname:hover{border-color:var(--line)}
.pname:focus{background:var(--surface);border-color:var(--line2)}
.tbtn{flex:none;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font:600 13.5px var(--body);color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{color:var(--ink);border-color:var(--ink3)}
.tbtn svg{width:16px;height:16px}
.tabs{display:none;gap:4px;padding:10px 0 0}
.tabs button{flex:1;background:transparent;border:1px solid var(--line2);border-radius:8px;padding:8px 6px;font:600 14px var(--body);color:var(--ink2)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--ground)}
/* layout */
.work{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start;padding-top:18px}
.pane{min-width:0}
.pane-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.pane-hd h2{margin:0;font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:6px 13px;font:600 13px var(--body);color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--ground)}
.right-tabs{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
/* material cards */
.mats{display:flex;flex-direction:column;gap:14px}
.mat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.mat-hd{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 12px}
.mat-ic{flex:none;width:30px;height:22px;display:flex;align-items:center;justify-content:center}
.mat-ic svg{width:30px;height:22px}
.mat-name{flex:1;min-width:0;font:700 16px var(--body);border-color:transparent;background:transparent;padding:4px 6px}
.mat-name:hover{border-color:var(--line)}
.mat-note{flex:none;color:var(--ink3);font-size:13px;white-space:nowrap}
.icon{flex:none;width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:none;color:var(--ink3);display:inline-flex;align-items:center;justify-content:center;font-size:16px;padding:0}
.icon:hover{border-color:var(--line2);color:var(--ink)}
.parts{padding:0 10px 4px}
.prow{display:grid;grid-template-columns:22px minmax(0,1fr) 52px 104px 30px;gap:6px;align-items:center;padding:3px 0}
.sheetmat .prow{grid-template-columns:22px minmax(0,1fr) 46px 92px 92px 30px 30px}
.prow.head{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:2px 0 4px}
.prow input{width:100%;padding:6px 7px;font-size:15px}
.prow .pq{text-align:center}
.plet{width:22px;height:22px;border-radius:5px;background:var(--pine);color:#3B2A12;font:700 12px var(--mono);display:flex;align-items:center;justify-content:center;border:1px solid var(--pine-edge)}
.sheetmat .plet{background:var(--ply);border-color:var(--ply-edge)}
.grain{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--surface);color:var(--ink3);display:inline-flex;align-items:center;justify-content:center;padding:0}
.grain svg{width:18px;height:18px}
.grain[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.addpart{margin:6px 0 8px;background:none;border:1px dashed var(--line2);border-radius:7px;padding:6px 10px;font:600 13.5px var(--body);color:var(--ink2);width:100%;text-align:left}
.addpart:hover{border-color:var(--ink3);color:var(--ink)}
.perr{color:var(--bad);font-size:13px;font-weight:600;padding:0 12px 8px}
.stock{border-top:1px solid var(--line);background:var(--surface2);border-radius:0 0 var(--r) var(--r)}
.stock>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
.stock>summary::-webkit-details-marker{display:none}
.stock>summary b{color:var(--ink);font-weight:600}
.stock>summary .chev{margin-left:auto;transition:transform .15s;color:var(--ink3)}
.stock[open]>summary .chev{transform:rotate(90deg)}
.stock .chips{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:2px 8px;font:500 12.5px var(--mono);color:var(--ink2);white-space:nowrap}
.chip.have{border-style:dashed;color:var(--good)}
.stock-bd{padding:0 12px 12px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 88px 110px 30px;gap:6px;align-items:center;padding:3px 0}
.sheetmat .srow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 80px 110px 30px}
.srow.head{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.srow input,.srow select{width:100%;padding:5px 7px;font-size:14.5px}
.money{position:relative}
.money span{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:14px;pointer-events:none}
.money input{padding-left:20px}
.hint{color:var(--ink3);font-size:12.5px;margin:6px 0 0}
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lbtn{background:none;border:0;color:var(--chalk);font:600 13.5px var(--body);padding:4px 2px}
.lbtn:hover{text-decoration:underline;text-underline-offset:3px}
.addmat{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px;border:1px dashed var(--line2);border-radius:var(--r);background:color-mix(in srgb,var(--surface) 60%,transparent)}
.addmat .lbl{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-right:4px}
.pbtn{background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:5px 10px;font:600 13.5px var(--body);color:var(--ink)}
.pbtn:hover{border-color:var(--ink3)}
.pbtn small{color:var(--ink3);font-weight:500}
/* plan */
.summary{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;box-shadow:var(--shadow)}
.total{font:800 56px/.9 var(--disp);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.total .cur{font-size:.55em;vertical-align:.55em;margin-right:2px;color:var(--ink2)}
.total-lbl{font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;align-self:center}
.fact b{display:block;font:600 19px var(--mono);font-variant-numeric:tabular-nums}
.fact span{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.yield{grid-column:1/-1;height:8px;border-radius:99px;background:var(--scrap);overflow:hidden;margin-top:10px;display:flex}
.yield i{display:block;height:100%;background:var(--pine2)}
.yield i.k{background:var(--chalk)}
.ylegend{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2)}
.ylegend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--pine2)}
.ylegend .k::before{background:var(--chalk)}
.ylegend .w::before{background:var(--scrap)}
.tips{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--tape-soft);border:1px solid color-mix(in srgb,var(--tape) 70%,var(--line));border-radius:var(--r);padding:10px 12px;font-size:14px}
.tip .tag{flex:none;background:var(--tape);color:var(--tape-ink);font:800 13px/1 var(--disp);letter-spacing:.08em;padding:4px 6px 3px;border-radius:4px;margin-top:1px}
.tip button{margin-left:auto;flex:none}
.warn{background:var(--bad-soft);border:1px solid var(--bad);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:14px;margin-top:12px}
.sec{margin-top:22px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-hd h3{margin:0;font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.shop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.shop table{width:100%;border-collapse:collapse;font-size:14.5px}
.shop th{text-align:left;font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:9px 12px 6px;border-bottom:1px solid var(--line)}
.shop td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:baseline}
.shop tr:last-child td{border-bottom:0}
.shop td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.shop td.q{font:600 15px var(--mono);white-space:nowrap;width:1%}
.shop .grp td{background:var(--surface2);font-weight:700;font-size:13px;padding:6px 12px}
.shop .have td{color:var(--good)}
.shop tfoot td{font-weight:700;border-top:1px solid var(--line2)}
.mdiag{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 6px;margin-top:12px}
.mdiag h4{margin:0 0 2px;font:700 16px var(--body)}
.mdiag h4 small{font:500 13px var(--body);color:var(--ink3);margin-left:6px}
.diag{display:block;width:100%;height:auto;overflow:visible}
.dg-wood{fill:var(--pine)}
.dg-ply{fill:var(--ply)}
.dg-grain{fill:none;stroke:var(--pine2);stroke-width:1;opacity:.75}
.dg-edge{fill:none;stroke:var(--pine-edge);stroke-width:1}
.dg-pedge{fill:none;stroke:var(--ply-edge);stroke-width:1}
.dg-part{fill:color-mix(in srgb,var(--surface) 22%,transparent);stroke:var(--pine-edge);stroke-width:1}
.dg-scrap{fill:url(#hatch)}
.dg-hatch{stroke:var(--scrap2);stroke-width:1.2}
.dg-hbg{fill:var(--scrap)}
.dg-kerf{stroke:var(--chalk);stroke-width:2}
.dg-cut{stroke:var(--chalk);stroke-width:1.6;stroke-dasharray:5 3}
.dg-num{fill:var(--chalk)}
.dg-numt{fill:var(--surface);font:700 10px var(--mono);text-anchor:middle;dominant-baseline:central}
.dg-lbl{fill:#2E220F;font:600 12px var(--mono);dominant-baseline:central}
.dg-lblb{fill:#2E220F;font:700 12px var(--mono);dominant-baseline:central}
.dg-meta{fill:var(--ink2);font:500 12px var(--mono);dominant-baseline:central}
.dg-metab{fill:var(--ink);font:700 12px var(--mono);dominant-baseline:central}
.dg-scrapt{fill:var(--ink3);font:500 11px var(--mono);dominant-baseline:central}
.dg-tape{fill:var(--tape)}
.dg-tick{stroke:var(--tape-ink);stroke-width:1}
.dg-ticklbl{fill:var(--tape-ink);font:700 9px var(--mono);dominant-baseline:central}
.steps{margin:6px 0 8px;padding:0;list-style:none;font-size:13.5px;color:var(--ink2);columns:2;column-gap:22px}
.steps li{break-inside:avoid;padding:2px 0;display:flex;gap:8px}
.steps li>b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--chalk);color:var(--surface);font:700 10.5px/20px var(--mono);text-align:center}
.steps .m{font:600 13.5px var(--mono);color:var(--ink)}
.empty{background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--ink2)}
/* at the saw */
.saw-bar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.saw-bar .prog{flex:1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.saw-bar .prog i{display:block;height:100%;background:var(--good);transition:width .25s}
.saw-bar b{font:600 15px var(--mono)}
.stk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.stk.done{opacity:.62}
.stk-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.stk-hd b{font:700 16px var(--body)}
.stk-hd span{color:var(--ink2);font-size:13.5px}
.stk-hd .n{margin-left:auto;font:600 13px var(--mono);color:var(--ink3)}
.cut{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;min-height:56px}
.cut:last-child{border-bottom:0}
.cut .box{flex:none;width:28px;height:28px;border-radius:7px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;color:transparent;font-weight:800}
.cut[aria-checked="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.cut[aria-checked="true"] .what{text-decoration:line-through;text-decoration-color:var(--ink3);color:var(--ink3)}
.cut .meas{flex:none;min-width:92px;font:600 22px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.cut .what{flex:1;min-width:0;font-size:14.5px;color:var(--ink2)}
.cut .what b{color:var(--ink);font-weight:700}
.cut .what small{display:block;color:var(--ink3);font-size:12.5px}
.cut.note{min-height:0;padding:8px 14px;color:var(--ink3);font-size:13px;cursor:default}
/* sheets */
.sheetbg{position:fixed;inset:0;background:rgba(18,20,22,.46);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:min(640px,100%);max-height:calc(100% - 24px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;border-radius:16px 16px 0 0;border-top:4px solid var(--tape);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .hd{display:flex;gap:8px;align-items:center;padding:14px 16px 8px}
.sheet .hd h2{margin:0;font:700 19px var(--body);flex:1}
.sheet .bd{overflow:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span:first-child{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.fld-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.btn{background:var(--ink);color:var(--ground);border:1px solid var(--ink);border-radius:8px;padding:8px 14px;font:700 14px var(--body)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.tape{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.pitem:last-child{border-bottom:0}
.pitem.on{background:var(--tape-soft)}
.pitem b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem span{color:var(--ink3);font-size:13px;white-space:nowrap}
textarea{width:100%;min-height:110px;font:13px var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:8px}
.note{color:var(--ink2);font-size:13.5px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:9px;font:600 13.5px var(--body);opacity:0;transition:.2s;pointer-events:none;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.lk{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;margin-bottom:12px}.lk b{display:block;font-size:17px}.lk ul{margin:6px 0 0;padding-left:18px;color:var(--ink2)}
.example{display:flex;gap:10px;align-items:center;background:var(--chalk-soft);border:1px solid color-mix(in srgb,var(--chalk) 40%,var(--line));border-radius:var(--r);padding:9px 12px;font-size:14px;margin-top:14px}
.example button{margin-left:auto;flex:none}
@media (max-width:960px){
  .work{grid-template-columns:minmax(0,1fr)}
  .tabs{display:flex}
  .right-tabs .seg{display:none}
  .app[data-tab="list"] .pane.plan,.app[data-tab="plan"] .pane.list,.app[data-tab="saw"] .pane.list{display:none}
  .pane-hd.lhd{display:none}
}
@media (max-width:560px){
  .tbtn .t{display:none}.tbtn{padding:7px 9px}
  .brand{font-size:22px;padding:4px 8px 3px 10px}
  .pname{font-size:16px}
  .total{font-size:46px}
  .summary{grid-template-columns:minmax(0,1fr);padding:12px 14px}
  .steps{columns:1}
  .sheetmat .prow{grid-template-columns:20px minmax(0,1fr) 40px 76px 76px 30px 26px;gap:4px}
  .prow{grid-template-columns:20px minmax(0,1fr) 44px 88px 28px;gap:5px}
  .prow input{padding:6px 5px;font-size:14.5px}
  .srow,.sheetmat .srow{grid-template-columns:minmax(0,1fr) 78px 96px 28px}
  .sheetmat .srow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 70px 96px 28px}
  .cut .meas{font-size:19px;min-width:78px}
}
@media (prefers-reduced-motion:reduce){.toast,.saw-bar .prog i,.stock>summary .chev{transition:none}}
[hidden]{display:none!important}

    H: '278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584'
  };
  Object.keys(FW).forEach(function (k) { FW[k] = FW[k].split(',').map(Number); });
  var WINANSI = { 8216: 145, 8217: 146, 8220: 147, 8221: 148, 8226: 149, 8211: 150, 8212: 151, 8230: 133, 215: 215, 8594: 187, 8242: 39, 8243: 34 };
  function pdfStr(s) { var o = ''; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); c = WINANSI[c] || c; if (c > 255 || (c > 126 && c < 160 && !(c >= 133 && c <= 151))) c = 63; var ch = String.fromCharCode(c); o += ch === '(' || ch === ')' || ch === '\\' ? '\\' + ch : ch; } return o; }

  function num(x) { return String(Math.round(x * 100) / 100); }
  function makePdf() {
    var PW = 612, PH = 792, M = 40, pages = [], ops = null, y = 0;
    function newPage() { ops = []; pages.push(ops); y = M; }
    function Y(v) { return num(PH - v); }
    function col(hex) { var n = parseInt(hex.slice(1), 16); return [(n >> 16) / 255, (n >> 8 & 255) / 255, (n & 255) / 255].map(num).join(' '); }
    function text(f, size, x, base, s, c) { ops.push('BT /' + (f === 'HB' ? 'F1' : 'F2') + ' ' + size + ' Tf ' + col(c || '#1C1F22') + ' rg ' + num(x) + ' ' + Y(base) + ' Td (' + pdfStr(s) + ') Tj ET'); }
    function rect(x, yy, w, h, fill, stroke, lw) { ops.push((fill ? col(fill) + ' rg ' : '') + (stroke ? col(stroke) + ' RG ' + num(lw || 0.6) + ' w ' : '') + num(x) + ' ' + Y(yy + h) + ' ' + num(w) + ' ' + num(h) + ' re ' + (fill && stroke ? 'B' : fill ? 'f' : 'S')); }
    function line(x1, y1, x2, y2, c, lw, dash) { ops.push(col(c) + ' RG ' + num(lw) + ' w ' + (dash ? '[3 2] 0 d ' : '') + num(x1) + ' ' + Y(y1) + ' m ' + num(x2) + ' ' + Y(y2) + ' l S' + (dash ? ' [] 0 d' : '')); }
    function need(h) { if (y + h > PH - M) newPage(); }
    newPage();
    rect(M, y, 58, 22, '#F2C200'); text('HB', 15, M + 8, y + 16, 'KERF');
    text('HB', 16, M + 70, y + 16, P.name);
    text('H', 9, M + 70, y + 29, 'Kerf ' + fmt(P.kerf) + (P.trim ? ' · trim ' + fmt(P.trim) + ' per end' : '') + ' · ' + new Date().toLocaleDateString());
    var tot = money(RES.cost); text('HB', 22, PW - M - textW('HB', 22, tot), y + 18, tot); text('H', 8, PW - M - textW('H', 8, 'TO BUY'), y + 29, 'TO BUY', '#80878E');
    y += 46;
    text('HB', 10, M, y, 'SHOPPING LIST', '#80878E'); y += 8;
    RES.mats.forEach(function (m) {
      if (!m.items.length) return;
      need(30); y += 12; text('HB', 11, M, y, m.mat.name + (m.mat.note ? '  (' + m.mat.note + ')' : ''));
      shopLines(m).forEach(function (l) { need(14); y += 14; text('H', 10.5, M + 12, y, l.n + ' ×  ' + l.dims.replace(' x ', ' × ') + (l.have ? '   (already have)' : '')); if (!l.have) { var t = money(l.price * l.n); text('H', 10.5, PW - M - textW('H', 10.5, t), y, t); } });
    });
    y += 8; line(M, y, PW - M, y, '#B9BFB7', 0.6); y += 14; text('HB', 11, M, y, 'Total'); text('HB', 11, PW - M - textW('HB', 11, tot), y, tot); y += 16;
    RES.mats.forEach(function (m) {
      if (!m.items.length) return;
      var width = PW - 2 * M;
      // keep the heading with the first diagram
      var first = m.kind === 'sheet' ? Math.min(width / m.items[0].L, 250 / m.items[0].W) * m.items[0].W + 60 : 50;
      need(24 + Math.min(first, PH - 2 * M - 24)); y += 18; text('HB', 12, M, y, m.mat.name + (m.kind === 'sheet' ? ' — sheets' : ' — boards')); y += 6;
      if (m.kind === 'board') {
        var maxLen = Math.max.apply(null, m.items.map(function (b) { return b.stock.len; })), lw = 44, px = (width - lw) / maxLen;
        m.items.forEach(function (b, bi) {

          text('HB', 10, M, y + 10, String(bi + 1)); text('H', 8.5, M, y + 22, fmt(b.stock.len, { ft: true }) + (b.stock.have ? ' yours' : ''));
          var x = M + lw; rect(x, y, b.stock.len * px, 24, '#EBD3A6', '#B08447', 0.8);
          var cx = x + b.trim * px;
          if (b.trim > 0) rect(x, y, b.trim * px, 24, '#CDD2CA');
          b.pieces.forEach(function (p, k) {
            var w = p.len * px; rect(cx, y, w, 24, null, '#B08447', 0.6);
            var lbl = letter(p.pi) + ' ' + fmt(p.len); if (textW('H', 8, lbl) > w - 4) lbl = letter(p.pi); if (textW('H', 8, lbl) < w - 2) text('H', 8, cx + (w - textW('H', 8, lbl)) / 2, y + 15, lbl, '#2E220F');
            cx += w; if (k < b.pieces.length - 1 || b.offcut > 0) { line(cx + P.kerf * px / 2, y - 2, cx + P.kerf * px / 2, y + 26, '#2361CC', 1); cx += P.kerf * px; }
          });
          var rest = x + b.stock.len * px - cx - b.trim * px; if (rest > 0.5) { rect(cx, y, rest, 24, '#CDD2CA'); var t = fmt(b.offcut); if (textW('H', 7.5, t) < rest - 4) text('H', 7.5, cx + (rest - textW('H', 7.5, t)) / 2, y + 15, t, '#50575E'); }
          y += 34;
          var parts = b.pieces.map(function (p) { var q = m.mat.parts[p.pi]; return letter(p.pi) + ' ' + (q && q.name ? q.name + ' ' : '') + fmt(p.len); }).join('   ·   ');
          text('H', 8, M + lw, y, parts.length > 150 ? parts.slice(0, 147) + '...' : parts, '#50575E');
        });
      } else {
        m.items.forEach(function (sh, si) {
          var px = Math.min(width / sh.L, 250 / sh.W), H = sh.W * px;
          var steps = sh.steps.filter(function (s) { return s.type !== 'none'; });
          need(Math.min(H + 36 + steps.length * 12, PH - 2 * M)); y += 14;
          text('HB', 10, M, y, 'Sheet ' + (si + 1)); text('H', 9, M + 50, y, fmt(sh.W) + ' × ' + fmt(sh.L) + (sh.stock.have ? '  (yours)' : '')); y += 6;
          rect(M, y, sh.L * px, H, '#CDD2CA');
          sh.placed.forEach(function (p) {
            var x = M + p.x * px, yy = y + p.y * px, w = p.l * px, h = p.w * px;
            rect(x, yy, w, h, '#E8D7B2', '#9E7F52', 0.6);
            var t = letter(p.pi); if (w > 16 && h > 12) text('HB', 9, x + (w - textW('HB', 9, t)) / 2, yy + h / 2 + (w > 70 && h > 26 ? -2 : 3), t, '#2E220F');
            var d = fmt(p.l) + ' × ' + fmt(p.w); if (w > 70 && h > 26 && textW('H', 7.5, d) < w - 4) text('H', 7.5, x + (w - textW('H', 7.5, d)) / 2, yy + h / 2 + 9, d, '#2E220F');

            if (st.type === 'none') return; n++;

            var cx = M + (l[0] + l[2]) / 2 * px, cy = y + (l[1] + l[3]) / 2 * px, t = String(n);

          });
          rect(M, y, sh.L * px, H, null, '#9E7F52', 0.8);
          y += H + 4;
          steps.forEach(function (st, k) {
            need(12); y += 12;
            var part = st.gives ? m.mat.parts[st.gives.it.pi] : null;

    pages.forEach(function (o) { var c = o.join('\n'), cid = add('<< /Length ' + c.length + ' >>\nstream\n' + c + '\nendstream'); kids.push(add('<< /Type /Page /Parent ' + pg + ' 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] /Resources << /Font << /F1 ' + f1 + ' 0 R /F2 ' + f2 + ' 0 R >> >> /Contents ' + cid + ' 0 R >>')); });

  // ---------- wiring ----------
  $('mats').addEventListener('input', onInput);
  $('mats').addEventListener('change', function (e) { if (e.target.tagName === 'SELECT') onInput(e); });
  $('mats').addEventListener('focusout', onBlur);
  $('mats').addEventListener('keydown', onKey);
  $('mats').addEventListener('click', onClick);
  $('pname').addEventListener('input', function () { P.name = this.value; if (P.example) { P.example = false; renderHead(); $('pname').focus(); } touch(); });
  $('setBtn').addEventListener('click', settingsSheet);
  $('projBtn').addEventListener('click', projectsSheet);
  $('pdfBtn').addEventListener('click', function () {
    if (!RES || !RES.mats.some(function (m) { return m.items.length; })) { toast('Add some parts first'); return; }
    var b = this; b.disabled = true;
    saveFile(fileName('pdf'), makePdf(), 'application/pdf').then(function (ok) { if (ok) toast('Saved the shop PDF'); }, function (e) { toast(e.message || 'Couldn’t save the PDF'); }).then(function () { b.disabled = false; });
  });
